<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Bium Memo Editor</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
      }

      #root > div:first-of-type {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
      }

      #root > div.dynamic-height,
      #root div.dynamic-height .ProseMirror {
        height: unset;
      }

      #root div .ProseMirror {
        min-height: 100%;
        overflow: visible;
      }

      .ProseMirror:focus {
        outline: none;
      }

      .highlight-background {
        background-color: #e6e6ff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
